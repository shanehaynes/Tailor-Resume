[project]
name = "tailor-resume"
version = "0.1.0"
description = "Ledger-backed resume tailoring with measured layout"
requires-python = ">=3.11"
dependencies = [
  "pdfplumber>=0.11",
  "pyyaml>=6.0",
  "jsonschema>=4.22",
]

[project.scripts]
rc = "rc.cli:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["rc"]

[tool.pytest.ini_options]
testpaths = ["tests"]
