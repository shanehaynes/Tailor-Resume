name: check
on:
  push: {branches: [main]}
  pull_request:
jobs:
  gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y poppler-utils xz-utils
      - uses: astral-sh/setup-uv@v6
      - run: make setup
      - run: make check
