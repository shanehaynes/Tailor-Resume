# =============================================================================
# EXAMPLE CAREER LEDGER — Jamie Rivera (fictional)
# A complete, invented ledger that exercises every schema feature. Tests build
# the golden resume from it (tests/fixtures/example.selection.yaml), and it is
# the shape reference for writing a real ledger (ledger/ledger.yaml). Nothing
# here describes a real person, employer, or school.
#
# Every bullet that ships must trace to an accomplishment `id`. Schema v1:
# ledger/schema.json. Validate with `uv run rc ledger check ledger/example.yaml`.
#
# FACT STATUS
#   confirmed   - the owner stated it directly in conversation (not just on a resume)
#   consistent  - identical across every source resume; never independently checked
#   single      - appears in only one source; needs the owner's confirmation
#   conflict    - sources make incompatible claims; RESOLVE BEFORE NEXT USE
#   derived     - computed from other facts; keep the derivation visible
#   retired     - no longer true or no longer to be claimed; never ships
#
# VARIANTS hold wording verbatim (as shipped, or proposed), with the versions
# that used it. They form the bullet bank. Fit (line count, orphans) is measured
# by the fit checker, not recorded here.
#   id      - unique within the accomplishment; selections cite `acc-id/variant-id`
#   uses    - the fact ids the wording relies on; every number in `text` must
#             appear in those facts' claims
#   status  - optional explicit status: proposed | single | conflict | retired.
#             EFFECTIVE status = worst of this and the used facts' statuses.
#   groups  - variants that ship together (a two-bullet split, a header + bullets)
# FACT `display` is the shipped wording of a short fact (education, additional
# lines) where it differs from `claim`; resumes render display, else claim.
# DEGREE VARIANTS are alternative renderings of a degree line; "A | B" renders
# as two lines under the degree title.
# =============================================================================

schema_version: 1

open_questions:  # answering these is the fastest way to make the ledger safe
  - id: q-on-time
    question: >-
      The carrier scorecard bullet says on-time pickup rose from 87% to 94%; an
      older resume says 92%. Which is right, and over what period?
  - id: q-detention
    question: >-
      Where does the 31% detention-fee reduction come from (finance report,
      estimate)? Can it be confirmed?
    note: "Until answered, dock-scheduling/detention needs an acknowledgment."

resolved_questions:  # history; answers come from the owner
  - id: q-misroutes
    resolved: 2026-01-15
    answer: "Misrouted pallets fell by about half, not 65%."
    consequence: "Fact misroutes-pct retired; variant cross-dock/half added."
  - id: q-major-title
    resolved: 2026-01-15
    answer: "Official major: Supply Chain Management, Transportation and Logistics concentration; Economics minor."
    consequence: "Abbreviated degree wording retired (edu-brookfield/base)."

